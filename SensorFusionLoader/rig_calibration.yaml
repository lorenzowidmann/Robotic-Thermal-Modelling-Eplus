# Canonical rig calibration: FLIR + ZED intrinsics, LiDAR<->camera extrinsics.
#
# Single source of truth for anything that needs to project LiDAR points into
# a camera image or read a camera's own K/distortion. Edit this file (not
# code) when a calibration is redone -- rig_calibration.py just loads it.
#
# Sources (Obsidian ThesisMD/ClaudeNotes, chosen as canonical per the user --
# each is a more carefully vetted/verdict-bearing result than the raw JSON
# files of the same name under this folder, which come from different
# tool/dataset runs and are kept only for traceability, not used here):
#   - risultato_calibrazione_intrinseca_flir_vue_pro_r.md
#     (produced by IntrinsicCalibration/IntCalibration_Flir.m)
#   - risultato_calibrazione_intrinseca_zed_2i.md
#     (SUPERSEDED: the zed block below now carries the
#      IntrinsicCalibration/IntCalibration_ZED.m result of 2026-08-02, the
#      same one lvt2calib/data/camera_info/zed_right_intrinsic.yaml has been
#      using since that date -- this file was simply the last one left on the
#      obsolete 1280x720 values)
#   - extrinsic_calibration_flir_newcalibration.md
#     (2026-09-14 NewCalibration session, SUPERSEDES
#     risultato_calibrazione_estrinseca_lidar_flir.md / Exttr_tryN below)
#   - risultato_calibrazione_estrinseca_lidar_zed_newcalibration.md
#     (2026-09-14 NewCalibration session, SUPERSEDES
#     risultato_calibrazione_estrinseca_lidar_zed.md / Exttr_tryN below)

schema: rig_calibration/v1

flir:
  camera: "FLIR Vue Pro R 336"
  source: risultato_calibrazione_intrinseca_flir_vue_pro_r.md
  date: 2026-07-31
  tool: "MATLAB estimateCameraParameters, no-skew model (IntrinsicCalibration/IntCalibration_Flir.m), checkerboard 45mm squares"
  # Images were rotated 180 degrees before board detection during BOTH this
  # intrinsic calibration and the LiDAR<->FLIR extrinsic below (camera is
  # mounted upside down on the rover) -- any FLIR frame fed through this
  # calibration must be rotated 180 degrees first (see
  # Flir/session9_only_rot180/*.npy for an already-rotated example).
  rotated_180_before_calibration: true
  image_size: {width: 336, height: 256}
  fx: 570.4796
  fy: 545.4275
  cx: 149.1501
  cy: 117.0047
  skew: 0.0
  dist_coeffs: [-0.4241, -0.1241, -0.0053, 0.0025, 0.0]  # k1, k2, p1, p2, k3 (k3 not fit, 0)
  caveats:
    - "cx/cy weakly constrained: corner detections only covered the central ~45% of the sensor (u=110-260, v=15-190 of 336x256). Reliable near frame center, less so near edges/corners."
    - "k2 unstable across iterations of this calibration campaign (-8.06 to +0.14 range seen); k1 and fx/fy are the trustworthy parameters (validated independently against the documented 32x26 deg FOV, within 0.1 deg)."
    - "Differs from Calibration/flir_intrinsics.json (fx=567.38, OpenCV tool, different image subset, generated 2026-07-27) -- both are plausible, this MATLAB no-skew result is used here per the note's explicit verdict."

zed:
  camera: "ZED 2i (right eye, UVC)"
  source: IntrinsicCalibration/IntCalibration_ZED.m
  date: 2026-08-02
  tool: "MATLAB estimateCameraParameters, no-skew model (IntCalibration_ZED.m), checkerboard 8x6 inner corners, 25mm squares, 25/25 images used"
  # Calibrated at native 1920x1080 -- the SAME resolution the recording
  # sessions use (see zed_record.py's metadata.json "resolution": "HD1080"),
  # so rig_calibration.py's zed_K_for(1920, 1080) is now a no-op rescale.
  # Distortion coeffs are resolution-independent (normalized-coordinate
  # model) and are used as-is at any capture size.
  calibration_image_size: {width: 1920, height: 1080}
  fx: 1412.3362
  fy: 1414.4716
  cx: 1012.8503
  cy: 569.7181
  skew: 0.0
  dist_coeffs: [-0.1558253, 0.009026829, 0.0006208599, 0.0005667587, 0.0]  # k1, k2, p1, p2, k3 (k3 not fit, 0)
  mean_reproj_px: 0.2151
  caveats:
    - "Replaces the previous 1280x720 result (fx=701.01, zed_intrinsic_calib.py, 5x3 inner corners, 44.99mm squares, 2026-07-25) which was never cross-checked: rescaled to 1080p it implies fx=1051.5 and FOV_h=84.8 deg, ~34% off this fit and matching no ZED 2i lens variant. This MATLAB result implies FOV_h=68.41 deg / FOV_v=41.79 deg, consistent with the 4mm-lens ZED 2i."
    - "Independently confirmed by Calibration/zed_right_intrinsics.json (OpenCV, same 25 images, fx=1413.57 fy=1415.79 cx=1011.19 cy=569.23): the two tools agree to <1.3px on every parameter."
    - "cx/cy sit +2.75% of width/height off the frame centre and corners span only 65% of the frame area (u 106-1733, v 136-969), so k1/k2 are extrapolated rather than measured near the edges."
    - "3 images flagged as high-error outliers (right_055 0.437px, right_058 0.436px, right_067 0.368px) but kept -- overall mean is 0.2151px."
    - "The lidar_to_zed extrinsic below is CONSISTENT with these intrinsics: lvt2calib/data/camera_info/zed_right_intrinsic.yaml was already updated to this exact MATLAB result on 2026-08-02 (old 1280x720 file kept as zed_right_intrinsic_OLD_backup_20260802.yaml), and the Exttr_tryN extrinsic session ran 2026-08-03, i.e. after. No re-solve needed."

lidar_to_flir:
  source: extrinsic_calibration_flir_newcalibration.md
  date: 2026-09-14
  tool: "LVT2Calib extrinsic_calib_l2c, min2d fit, 8 poses (1,4,6,10,12,16,18,19 of 12 collected), discarded by LiDAR<->camera range-diff (validated proxy, not post-hoc RMSE)"
  session: NewCalibration
  # Row-major 4x4, maps a point in the LiDAR/laser frame to the FLIR camera
  # frame: p_cam = T @ [x, y, z, 1]  (p_cam then goes through flir.K/dist to
  # get pixels). Requires the SAME 180-degree FLIR image rotation used to
  # derive it (see flir.rotated_180_before_calibration above).
  T_lidar_to_cam:
    - [ 0.0341815,  -0.999411,  -0.00291375, -0.113658]
    - [ 0.0176056,   0.00351714, -0.999839,   0.122095]
    - [ 0.999261,    0.0341247,   0.0177155, -0.0039121]
    - [ 0.0,         0.0,         0.0,         1.0]
  rmse_3d_m: 0.110148
  reproj_px: 0.647362
  caveats:
    - "SUPERSEDES the 2026-08-03 Exttr_tryN result (RMSE 5.81cm, 6/10 poses) as of this edit. RMSE 3D is WORSE here (11.0cm vs 5.8cm), but reprojection -- the metric that matters for pixel projection -- is near-identical (0.65px vs 0.66px). Structural cause: depth is the weakly-observable direction for a planar-board homography, and the FLIR's much lower resolution (f~570px vs f~1412px for the ZED) means the same 1px centre-detection error costs more than double the depth error at ~4.1m range -- not a fixable procedural issue at this distance/resolution."
    - "min2d chosen over min3d: on this same 8-pose set min3d gives a wildly different translation (0.009, 0.033, -0.027 vs -0.114, 0.122, -0.004), and a stability test (refit after dropping just 1 pose) moved min3d by 20-28cm on x/y while min2d moved <1cm -- min3d is ill-conditioned here, min2d is the stable regressor."
    - "Unexplained ~10cm systematic shift on y vs the Exttr_tryN result (0.122 vs 0.015), consistent across every pose subset tried in this session -- not confidently attributed to rig movement (a bolted rig should not show 10cm of play, and the ZED pair only shifted ~4.8cm between the same two sessions). Verify with a direct physical measurement if this matters downstream."
    - "11.0cm RMSE is fine for qualitative/zone-level thermal-bridge analysis, not for precise pixel-perfect edges."

lidar_to_zed:
  source: risultato_calibrazione_estrinseca_lidar_zed_newcalibration.md
  date: 2026-09-14
  tool: "LVT2Calib extrinsic_calib_l2c, min2d fit, 7 poses (of 9 collected), discarded by measurable board-shape defect (two centres closer than the nominal 300mm)"
  session: NewCalibration
  # Same convention as lidar_to_flir.T_lidar_to_cam, no image rotation needed
  # for ZED (orientation confirmed correct by the user during this session).
  T_lidar_to_cam:
    - [-0.00934483, -0.999952,  -0.00297536, -0.0360382]
    - [-0.0490803,   0.00343057, -0.998789,   0.12584]
    - [ 0.998751,   -0.00918748, -0.04911,     0.010033]
    - [ 0.0,         0.0,         0.0,         1.0]
  rmse_3d_m: 0.0703013
  reproj_px: 1.17187
  caveats:
    - "SUPERSEDES the 2026-08-03 Exttr_tryN result (RMSE 6.78cm, 8/10 poses) as of this edit. RMSE 3D is comparable (7.0cm vs 6.8cm); the reason to switch is translation STABILITY across pose subsets -- min3d on this data swings the estimated y by up to 30cm between the 6/7/9-pose subsets (a sign of an ill-conditioned fit, confirmed since its RMSE improves monotonically while the parameter itself does not converge), while min2d stays within 2-3cm across the same subsets."
    - "7/9 poses used (below the 9-pose literature minimum, by two); the 2 discarded poses (3, 10) have an independently measurable defect -- board sides of 266mm/287mm instead of the nominal 300mm -- not a post-hoc RMSE-driven exclusion."
    - "7.0cm RMSE 3D is comparable order of magnitude to the FLIR pair (11.0cm); 2D reprojection is worse (1.17px vs 0.65px for FLIR) but still fine for zone-level work."
